        <h1>DeenScroll — Scroll Less, Deen More</h1>
        <p>DeenScroll is an interactive Islamic educational platform with games, quizzes, and content designed to replace mindless scrolling with meaningful Islamic knowledge.</p>

        <h2>Free Games</h2>
        <h3>Islamic Trivia</h3>
        <p>Test your knowledge with 150+ questions across 6 categories: Quran, Seerah, Prophets, Fiqh, History, and Ramadan. Track your progress, build streaks, and learn something new every day.</p>

        <h3>Surah Match</h3>
        <p>Match Arabic surah names with their English translations. Learn all 114 surahs of the Quran through an engaging matching game with scoring and streaks.</p>

        <h3>Guess the Emoji</h3>
        <p>64 Islamic concepts represented by emojis. Can you guess the Islamic term from the emoji clues? A fun way to test your Islamic vocabulary.</p>

        <h3>True or False — Hadith Edition</h3>
        <p>80 hadith statements — determine which are authentic and which are fabricated. Learn important hadith while testing your knowledge.</p>

        <h3>Islamic Bingo</h3>
        <p>Daily and weekly deed tracking with bingo-style cards. Complete good deeds, build streaks, and make your daily worship a habit.</p>

        <h3>Islam for Beginners</h3>
        <p>A comprehensive guide for new Muslims and anyone wanting to learn the basics. Includes a complete prayer guide with all 5 daily prayers (Fajr, Dhuhr, Asr, Maghrib, Isha), step-by-step instructions for each prayer position with Arabic text, transliteration, and English translation. Also includes essential surahs for prayer (Al-Fatiha, Al-Ikhlas, Al-Falaq, An-Nas, Al-Kawthar) and 12 common daily duas.</p>

        <h2>Premium Content</h2>
        <h3>Fun Islamic Facts</h3>
        <p>90+ swipeable facts across 9 categories covering fascinating aspects of Islamic history, science, culture, and more.</p>

        <h3>Stories of the Prophets</h3>
        <p>20 powerful stories of the Prophets of Islam with reflection prompts. Learn about Adam, Nuh, Ibrahim, Musa, Isa, Muhammad (peace be upon them all), and more.</p>

        <h3>Mood Reminders</h3>
        <p>Personalized Quran verses, hadith, and duas for 12 different moods. Feeling anxious, grateful, sad, or hopeful? Find comfort in the words of Allah and His Messenger.</p>

        <h3>Miracles of the Quran</h3>
        <p>Explore 21 miracles of the Quran across scientific, numerical, and linguistic categories. From the expanding universe to the precise word counts, discover the signs that point to the divine origin of the Quran.</p>

        <h3>Surah Summaries</h3>
        <p>Browse summaries of key surahs with themes, revelation context (Meccan or Medinan), and key lessons. Search by name, number, or theme.</p>

        <h2>About DeenScroll</h2>
        <p>We spend hours scrolling through content that doesn't benefit us. DeenScroll replaces that habit with engaging Islamic knowledge — trivia, stories, prayer guides, and more — designed to feel just as engaging, but actually good for your akhirah.</p>
