<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0e0c">
<title>Japan Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --surface:#ffffff; --surface2:#faf7f2; --ink:#17150f; --muted:#6d665b; --line:#e7e0d4;
  --accent:#d1442b; --accent-ink:#fff;
  --c-booked:#178a58; --c-essential:#d1442b; --c-musttry:#d6820a; --c-gem:#7a4bd0;
  --c-popular:#2f6fd6; --c-local:#11878a; --c-optional:#8b8579; --c-none:#b9b2a6;
  --warn:#8a5a00; --warn-bg:#fdf1d6;
  --radius:18px; --shadow:0 1px 2px rgba(20,15,5,.05),0 10px 30px rgba(20,15,5,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0e0c; --surface:#1a1814; --surface2:#151310; --ink:#f3eee5; --muted:#a39b8e; --line:#2c2821;
    --accent:#f06a51; --accent-ink:#130f0b;
    --c-booked:#4cc98e; --c-essential:#f06a51; --c-musttry:#f2a93b; --c-gem:#b08cf5;
    --c-popular:#6ea1f5; --c-local:#4cc3c5; --c-optional:#a39b8e; --c-none:#5a544a;
    --warn:#f5c86e; --warn-bg:#33270f; --shadow:0 1px 0 rgba(255,255,255,.03);
  }
}
:root[data-theme="dark"]{
  --bg:#0f0e0c; --surface:#1a1814; --surface2:#151310; --ink:#f3eee5; --muted:#a39b8e; --line:#2c2821;
  --accent:#f06a51; --accent-ink:#130f0b;
  --c-booked:#4cc98e; --c-essential:#f06a51; --c-musttry:#f2a93b; --c-gem:#b08cf5;
  --c-popular:#6ea1f5; --c-local:#4cc3c5; --c-optional:#a39b8e; --c-none:#5a544a;
  --warn:#f5c86e; --warn-bg:#33270f; --shadow:0 1px 0 rgba(255,255,255,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.015em;margin:0}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(209,68,43,.22),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,rgba(122,75,208,.18),transparent 60%),var(--bg)}
.gatebox{width:100%;max-width:360px;text-align:center}
.sun{width:64px;height:64px;border-radius:50%;background:var(--accent);margin:0 auto 18px;box-shadow:0 0 0 10px rgba(209,68,43,.12)}
.gatebox h1{font-size:40px;line-height:1.05;margin-bottom:8px}
.gatebox p{color:var(--muted);margin:0 0 24px}
.gatebox input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;outline:none}
.gatebox input:focus{border-color:var(--accent)}
.gatebox button{margin-top:10px;width:100%;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);cursor:pointer}
.err{color:var(--accent);min-height:22px;margin-top:10px;font-size:14px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.seg{margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}

/* ---------- hero ---------- */
.hero{position:relative;margin:14px 0 0;border-radius:24px;overflow:hidden;min-height:210px;background:linear-gradient(135deg,#2a1d17,#4b2a20 45%,#1b2340);color:#fff;box-shadow:var(--shadow)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.hero img.on{opacity:1}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.72))}
.hero .in{position:relative;z-index:1;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;min-height:210px}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h1{font-size:44px;line-height:1;margin:4px 0 6px}
.hero .base{font-size:12.5px;color:rgba(255,255,255,.85);max-width:560px}
.credit{position:absolute;right:10px;top:8px;z-index:1;font-size:10px;color:rgba(255,255,255,.65)}

/* ---------- day scroller ---------- */
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 12px 9px;cursor:pointer;text-align:left;min-width:84px;position:relative}
.dchip .wd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dchip .n{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:700;line-height:1.05}
.dchip .lbl{font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.dchip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip[aria-selected="true"] .wd,.dchip[aria-selected="true"] .lbl{color:var(--bg);opacity:.75}
.dchip .today{position:absolute;top:8px;right:9px;font-size:9px;font-weight:800;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 5px}

/* ---------- day head ---------- */
.dayhead{margin:14px 0 6px}
.dayhead .date{font-size:13px;color:var(--muted);font-weight:600}
.dayhead h2{font-size:30px;line-height:1.1;margin:2px 0 6px}
.dayhead p{margin:0;color:var(--muted)}
.note{margin-top:10px;font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px}
.stats{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.stat{font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.stat b{color:var(--ink)}

/* ---------- legend / filters ---------- */
.legend{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.lg{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;cursor:pointer;color:var(--ink);white-space:nowrap}
.lg .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.lg[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.lg[aria-pressed="true"] .dot{background:#fff}
.lg.tired{border-style:dashed}
.lg.tired[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);border-style:solid}
.lg.clear{color:var(--muted)}
@media (hover:hover) and (pointer:fine){ .legend{flex-wrap:wrap;overflow-x:visible} }

/* ---------- timeline ---------- */
ol.tl{list-style:none;margin:8px 0 0;padding:0}
.stop{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:7px 0;position:relative}
.stop:before{content:"";position:absolute;left:69px;top:0;bottom:0;width:2px;background:var(--line)}
.stop:first-child:before{top:24px}.stop:last-child:before{bottom:calc(100% - 24px)}
.time{font-size:12px;font-weight:700;color:var(--muted);padding-top:15px;text-align:right;line-height:1.25}
.node{position:absolute;left:63px;top:17px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c);z-index:1}
.stop.k-booked .node{background:var(--c)}
.card{margin-left:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.k-optional .card{border-style:dashed}
.k-optional .card:before{background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 11px)}
.ph{position:relative;aspect-ratio:16/8;max-height:230px;width:100%;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--surface2)),var(--surface2));overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .6s}
.ph img.on{opacity:1}
.card:hover .ph img.on{transform:scale(1.03)}
.ph .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.55}
.ph.loaded .glyph{display:none}
.ph.loaded .src{display:block}
.ph .src{display:none;position:absolute;right:8px;bottom:6px;font-size:9.5px;color:#fff;opacity:.8;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.body{padding:12px 14px 13px 18px}
.card h3{font-size:18px;line-height:1.25}
.desc{margin:6px 0 0;font-size:14px;color:var(--ink);opacity:.88}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;padding:2px 0 0;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.tag{font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.tag.optional{border:1px dashed var(--c);background:transparent}
.cost{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto}
.maplink{font-size:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);background:var(--surface2)}
.alert{margin-top:10px;font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px}
/* logistics rows (no category) */
.stop.k-none .card{background:transparent;box-shadow:none;border-style:dashed}
.stop.k-none .card:before{display:none}
.stop.k-none .body{padding:9px 12px}
.stop.k-none h3{font-family:inherit;font-size:14px;font-weight:600}
.stop.k-none .desc{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px}

/* ---------- food ---------- */
.food{margin:26px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 6px;box-shadow:var(--shadow)}
.food h3{font-size:20px}
.food .sub{font-size:12px;color:var(--muted);margin:2px 0 10px}
.prayer{font-size:13px;margin:0 0 10px;background:var(--surface2);border-radius:12px;padding:9px 11px}
.fitem{border-top:1px solid var(--line);padding:11px 0}
.fitem:first-of-type{border-top:0}
.ftop{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ftop b{font-size:15px}
.fwhere{font-size:12px;color:var(--muted)}
.fwhat{font-size:13px;margin:3px 0 0}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.pill.cert{color:var(--c-booked);background:color-mix(in srgb,var(--c-booked) 14%,transparent)}
.pill.friendly{color:var(--c-gem);background:color-mix(in srgb,var(--c-gem) 14%,transparent)}
.pill.check{color:var(--c-optional);background:color-mix(in srgb,var(--c-optional) 16%,transparent)}
.fprice{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- bookings view ---------- */
.bk-day{margin:20px 0 0}
.bk-day h3{font-family:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.bk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c-booked);border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.bk .bt{font-size:12px;font-weight:700;color:var(--c-booked);min-width:60px;padding-top:1px}
.bk b{display:block;font-size:14.5px}
.bk span{font-size:12px;color:var(--muted)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nav button{border:0;background:transparent;color:var(--bg);opacity:.7;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
.nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.spacer{height:110px}
footer{margin-top:34px;font-size:12px;color:var(--muted);text-align:center}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:440px){
  .stop{grid-template-columns:44px 1fr;gap:8px}
  .stop:before{left:51px}.node{left:45px}
  .card{margin-left:12px}
  .hero h1{font-size:38px}
  .seg button{padding:6px 9px}
  .brand span{display:none}
}
</style>
</head>
<body>
<div id="gate">
  <form class="gatebox" id="gateform" autocomplete="off">
    <div class="sun"></div>
    <div class="eyebrow">Ash · Zuha · Aahab · Sam</div>
    <h1>Japan, October</h1>
    <p>Osaka → Kyoto → Tokyo. Enter the password to open the trip.</p>
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
    <button type="submit">Open the trip</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app" hidden></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(BLOB.s), iterations:BLOB.n, hash:"SHA-256"},
              base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.i)}, key, b64(BLOB.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
document.getElementById("gateform").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  try{ const data = await unlock(pw); store.set("jp_pw", pw); start(data); }
  catch(err){ document.getElementById("err").textContent = "That's not it. Try again."; }
});
(async () => { const saved = store.get("jp_pw"); if(saved){ try{ start(await unlock(saved)); }catch(e){} } })();
(() => { const th = store.get("jp_theme"); if(th) document.documentElement.dataset.theme = th; })();

/* ---------- categories ---------- */
const CATS = [
  ["booked",   "Booked",        "🎟️"],
  ["essential","Must-do",       "⭐"],
  ["musttry",  "Must-try food", "🍜"],
  ["gem",      "Hidden gem",    "💎"],
  ["popular",  "Popular",       "🔥"],
  ["local",    "Local favourite","🏮"],
  ["optional", "Skip if tired", "💤"],
];
const CAT = Object.fromEntries(CATS.map(([k,l,g]) => [k,{label:l,glyph:g}]));
const ORDER = CATS.map(c => c[0]);
const STATUS = {cert:"Halal certified", friendly:"Halal menu", check:"Check at door"};
function kind(r){ for(const k of ORDER){ if(r.tags.includes(k)) return k; } return "none"; }
function cvar(k){ return `--c:var(--c-${k})`; }

/* ---------- helpers ---------- */
function dayToDate(s){ const m = s.match(/(\d+) (\w+)/); return m ? Date.UTC(2026, 9, +m[1]) : null; }
function jstToday(){ const n = new Date(Date.now() + 9*3600e3); return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()); }
function strip(h){ const d = document.createElement("div"); d.innerHTML = h ?? ""; return d.textContent; }
function short(t){ return strip(t).split(/\s[&—–]\s|&|—/)[0].trim(); }

/* ---------- Wikipedia photos (loaded in the browser, cached) ---------- */
let PHOTO = {}; try{ PHOTO = JSON.parse(store.get("jp_photos_v2") || "{}"); }catch(e){}
const inflight = {};
function photoFor(title){
  if(!title) return Promise.resolve(null);
  if(title in PHOTO) return Promise.resolve(PHOTO[title]);
  if(inflight[title]) return inflight[title];
  const pick = j => { let u = j && (j.thumbnail?.source || j.originalimage?.source) || null; return u ? u.replace(/\/(\d+)px-/, "/960px-") : null; };
  const search = () => fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=960&gsrsearch=" + encodeURIComponent(title))
    .then(r => r.ok ? r.json() : null)
    .then(j => { const p = j && j.query && Object.values(j.query.pages || {})[0]; return p && p.thumbnail ? p.thumbnail.source : null; })
    .catch(() => null);
  inflight[title] = fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g,"_")))
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(j => pick(j) || search())
    .then(u => { if(u || navigator.onLine){ PHOTO[title] = u || null; store.set("jp_photos_v2", JSON.stringify(PHOTO)); } return u; });
  return inflight[title];
}
function loadImg(holder){
  const t = holder.dataset.wiki; if(!t) return;
  photoFor(t).then(u => {
    if(!u) return;
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    img.onload = () => { img.classList.add("on"); holder.classList.add("loaded"); };
    img.onerror = () => { img.remove(); };
    img.src = u; holder.prepend(img);
  });
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ io.unobserve(e.target); loadImg(e.target); } }), {rootMargin:"300px"}) : null;
function watchImgs(root){ root.querySelectorAll("[data-wiki]").forEach(h => io ? io.observe(h) : loadImg(h)); }

/* ---------- state ---------- */
let DATA, state = {city:0, day:0, view:"plan", filter:new Set(), tired:false, open:new Set()};
function start(data){
  DATA = data;
  document.getElementById("gate")?.remove();
  document.getElementById("app").hidden = false;
  const t = jstToday(); let found = false;
  DATA.cities.forEach((c, ci) => c.days.forEach((d, di) => { if(!found && dayToDate(d.date) === t){ state.city = ci; state.day = di; found = true; } }));
  if(!found){ const sc = store.get("jp_city"), sd = store.get("jp_day");
    if(sc !== null){ state.city = Math.min(+sc, DATA.cities.length-1); state.day = Math.min(+(sd||0), DATA.cities[state.city].days.length-1); } }
  state.tired = store.get("jp_tired") === "1";
  render();
}
function save(){ store.set("jp_city", state.city); store.set("jp_day", state.day); }

/* ---------- render ---------- */
function topbar(){
  const seg = DATA.cities.map((c,i) => `<button role="tab" aria-selected="${state.view==='plan' && i===state.city}" data-city="${i}">${c.name}</button>`).join("");
  return `<div class="bar"><div class="wrap"><div class="brand"><i></i><span>Japan '26</span></div>
    <div class="seg" role="tablist">${seg}</div>
    <button class="iconbtn" id="themebtn" aria-label="Toggle theme">◐</button></div></div>`;
}
function stopHTML(r, ri, city){
  const k = kind(r);
  const q = encodeURIComponent(short(r.title) + " " + city.name + " Japan");
  const tags = r.tags.filter(x => CAT[x]).map(x => `<span class="tag ${x}" style="${cvar(x)}">${CAT[x].label}</span>`).join("");
  const long = strip(r.desc).length > 170;
  const open = state.open.has(ri);
  const ph = (k !== "none") ? `<div class="ph" data-wiki="${r.wiki||""}"><div class="glyph">${(CAT[k]||{}).glyph||"📍"}</div>${r.wiki?`<span class="src">Wikipedia</span>`:""}</div>` : "";
  return `<li class="stop k-${k}" style="${cvar(k)}"><div class="time">${r.t||""}</div><span class="node"></span>
    <div class="card">${ph}<div class="body">
      <h3>${r.title}</h3>
      ${r.desc?`<p class="desc ${long && !open ? "clamp":""}">${r.desc}</p>${long?`<button class="more" data-more="${ri}">${open?"Show less":"Read more"}</button>`:""}`:""}
      <div class="meta">${tags}${k!=="none"?`<a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Map ↗</a>`:""}${r.cost?`<span class="cost">${r.cost}</span>`:""}</div>
      ${r.alert?`<div class="alert">⚠️ ${r.alert}</div>`:""}
    </div></div></li>`;
}
function planView(){
  const city = DATA.cities[state.city], day = city.days[state.day], t = jstToday();
  const chips = city.days.map((d,i) => { const isToday = dayToDate(d.date) === t; const [wd, n] = d.date.split(" ");
    return `<button class="dchip" role="tab" aria-selected="${i===state.day}" data-day="${i}">${isToday?'<span class="today">TODAY</span>':""}
      <div class="wd">${wd.slice(0,3)}</div><div class="n">${n}</div><div class="lbl">${short(d.title)}</div></button>`; }).join("");
  const counts = {}; day.rows.forEach(r => r.tags.forEach(x => counts[x] = (counts[x]||0)+1));
  const legend = CATS.filter(([k]) => k !== "optional").map(([k,l]) =>
      `<button class="lg" style="${cvar(k)}" data-f="${k}" aria-pressed="${state.filter.has(k)}"><span class="dot"></span>${l}${counts[k]?` · ${counts[k]}`:""}</button>`).join("")
    + `<button class="lg tired" style="${cvar('optional')}" id="tiredbtn" aria-pressed="${state.tired}"><span class="dot"></span>${state.tired?"Tired mode on":"Tired? Hide skippable"}</button>`
    + (state.filter.size?`<button class="lg clear" id="clearf">Clear ✕</button>`:"");
  const vis = day.rows.map((r,i) => [r,i]).filter(([r]) => {
    if(state.tired && r.tags.includes("optional")) return false;
    if(state.filter.size && !r.tags.some(x => state.filter.has(x))) return false;
    return true; });
  const rows = vis.map(([r,i]) => stopHTML(r, i, city)).join("") || `<div class="empty">Nothing matches that filter today.</div>`;
  const booked = day.rows.filter(r => r.tags.includes("booked")).length, must = day.rows.filter(r => r.tags.includes("essential")).length;
  const food = day.food ? `<section class="food"><h3>🍽️ Suggested to eat</h3><div class="sub">Near today's route · no fixed time · if you want</div>
      ${day.food.prayer?`<p class="prayer">🕌 ${day.food.prayer}</p>`:""}
      ${day.food.items.map(f => `<div class="fitem"><div class="ftop"><b>${f.name}</b><span class="pill ${f.status}">${STATUS[f.status]||f.status}</span><span class="fprice">${f.price}</span></div>
        <div class="fwhere">${f.where} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(strip(f.name)+" "+city.name+" Japan")}" target="_blank" rel="noopener">map</a></div><p class="fwhat">${f.what}</p></div>`).join("")}</section>` : "";
  return `<div class="wrap fade">
    <section class="hero"><div class="in" data-hero="${city.hero||""}">
      <div class="eyebrow">${city.dates}</div><h1>${city.name}</h1><div class="base">🏠 ${city.base}</div></div></section>
    <div class="days" role="tablist">${chips}</div>
    <section class="dayhead"><div class="date">${day.date}</div><h2>${day.title}</h2>${day.desc?`<p>${day.desc}</p>`:""}
      ${day.note?`<div class="note">⚠️ ${day.note}</div>`:""}
      <div class="stats"><span class="stat"><b>${day.rows.length}</b> stops</span>${must?`<span class="stat"><b>${must}</b> must-do</span>`:""}${booked?`<span class="stat"><b>${booked}</b> booked</span>`:""}<span class="stat">Swipe ← → for days</span></div></section>
    <div class="legend">${legend}</div>
    <ol class="tl" id="tl">${rows}</ol>
    ${food}
    <footer>Times are a rough pace, not appointments — only booked items are fixed.</footer>
    <div class="spacer"></div></div>`;
}
function bookingsView(){
  const out = [];
  DATA.cities.forEach((c, ci) => c.days.forEach((d, di) => {
    const b = d.rows.filter(r => r.tags.includes("booked") && !/^(Check out|Leave|Arrive Tokyo|Walk to)/.test(strip(r.title)));
    if(b.length) out.push(`<div class="bk-day"><h3>${d.date} · ${c.name}</h3>${b.map(r =>
      `<div class="bk" data-go="${ci}:${di}"><div class="bt">${r.t||""}</div><div><b>${r.title}</b><span>${r.cost||""}${r.alert?(r.cost?" · ":"")+strip(r.alert).slice(0,90)+(strip(r.alert).length>90?"…":""):""}</span></div></div>`).join("")}</div>`);
  }));
  return `<div class="wrap fade"><section class="dayhead" style="margin-top:22px"><div class="eyebrow">Everything with a time or a ticket</div><h2>Bookings</h2>
    <p>Tap any booking to jump to that day.</p></section>${out.join("")}<div class="spacer"></div></div>`;
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = topbar() + (state.view === "plan" ? planView() : bookingsView()) +
    `<nav class="nav" role="tablist"><button data-view="plan" aria-selected="${state.view==='plan'}">Itinerary</button><button data-view="bookings" aria-selected="${state.view==='bookings'}">Bookings</button></nav>`;
  bind(app);
  watchImgs(app);
  const hero = app.querySelector("[data-hero]");
  if(hero && hero.dataset.hero){ photoFor(hero.dataset.hero).then(u => { if(!u) return; const img = new Image(); img.alt=""; img.onload=()=>img.classList.add("on"); img.src=u; hero.parentElement.prepend(img); }); }
  const sel = app.querySelector('.dchip[aria-selected="true"]'); if(sel) sel.scrollIntoView({inline:"center", block:"nearest"});
}
function goDay(delta){
  const c = DATA.cities[state.city]; let d = state.day + delta, ci = state.city;
  if(d < 0){ if(ci === 0) return; ci--; d = DATA.cities[ci].days.length-1; }
  else if(d >= c.days.length){ if(ci === DATA.cities.length-1) return; ci++; d = 0; }
  state.city = ci; state.day = d; state.open.clear(); save(); render(); window.scrollTo({top:0, behavior:"smooth"});
}
function bind(app){
  app.querySelectorAll("[data-city]").forEach(b => b.onclick = () => { state.view="plan"; state.city = +b.dataset.city; state.day = 0; state.open.clear(); save(); render(); window.scrollTo({top:0}); });
  app.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { state.day = +b.dataset.day; state.open.clear(); save(); render(); });
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const f = b.dataset.f; state.filter.has(f) ? state.filter.delete(f) : state.filter.add(f); render(); });
  app.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { const i = +b.dataset.more; state.open.has(i) ? state.open.delete(i) : state.open.add(i); render(); });
  app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); window.scrollTo({top:0}); });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const [ci,di] = b.dataset.go.split(":").map(Number); state.view="plan"; state.city=ci; state.day=di; save(); render(); window.scrollTo({top:0}); });
  const tb = document.getElementById("tiredbtn"); if(tb) tb.onclick = () => { state.tired = !state.tired; store.set("jp_tired", state.tired?"1":"0"); render(); };
  const cf = document.getElementById("clearf"); if(cf) cf.onclick = () => { state.filter.clear(); render(); };
  document.getElementById("themebtn").onclick = () => {
    const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.dataset.theme = cur === "dark" ? "light" : "dark"; store.set("jp_theme", r.dataset.theme); };
}
/* swipe between days */
let sx = null, sy = null;
document.addEventListener("touchstart", e => { if(state.view!=="plan" || e.target.closest(".days,.legend")) { sx=null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => { if(sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6) goDay(dx < 0 ? 1 : -1); sx = null; }, {passive:true});
document.addEventListener("keydown", e => { if(!DATA || state.view!=="plan") return; if(e.key==="ArrowRight") goDay(1); if(e.key==="ArrowLeft") goDay(-1); });
</script>
</body>
</html>
