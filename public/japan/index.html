<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Japan Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,100,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&text=%E5%A4%A7%E9%98%AA%E4%BA%AC%E9%83%BD%E6%9D%B1%E6%97%A5%E6%9C%AC%E3%81%8A%E3%81%95%E3%81%8B%E3%81%8D%E3%82%87%E3%81%86%E3%81%A8%E6%97%85%E5%88%87%E7%AC%A6%E8%A1%8C%E9%A3%9F%E4%BA%88%E7%B4%84&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EF; --surface:#FFFFFF; --surface2:#E9EBE5; --ink:#1B2030; --muted:#5E6577; --line:#D9DCD3; --hair:#E4E6E0;
  --city-0:#D7263D; --city-1:#4F8A2B; --city-2:#2457B8; --city-3:#7A4FC4;
  --c-booked:#1F8A5B; --c-essential:#C8432B; --c-musttry:#B9750F; --c-gem:#7650C9;
  --c-popular:#2F6FD6; --c-local:#11878A; --c-optional:#8B8F98; --c-none:#B8BCC4;
  --warn:#7A5300; --warn-bg:#FBEFD2;
  --sign:#FFFFFF; --sign-ink:#1B2030;
  --lift:0 1px 0 rgba(27,32,48,.04),0 6px 18px -8px rgba(27,32,48,.18);
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10131B; --surface:#181C27; --surface2:#141823; --ink:#ECEEF3; --muted:#9097A8; --line:#2A2F3D; --hair:#21263266;
    --city-0:#F25467; --city-1:#86C25A; --city-2:#6E98F0; --city-3:#B08CF5;
    --c-booked:#4CC98E; --c-essential:#F0715A; --c-musttry:#F2A93B; --c-gem:#B08CF5;
    --c-popular:#6EA1F5; --c-local:#4CC3C5; --c-optional:#9097A8; --c-none:#4A5060;
    --warn:#F5C86E; --warn-bg:#2E2510; --sign:#1D2230; --sign-ink:#ECEEF3;
    --lift:0 1px 0 rgba(255,255,255,.03),0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#10131B; --surface:#181C27; --surface2:#141823; --ink:#ECEEF3; --muted:#9097A8; --line:#2A2F3D; --hair:#21263266;
  --city-0:#F25467; --city-1:#86C25A; --city-2:#6E98F0; --city-3:#B08CF5;
  --c-booked:#4CC98E; --c-essential:#F0715A; --c-musttry:#F2A93B; --c-gem:#B08CF5;
  --c-popular:#6EA1F5; --c-local:#4CC3C5; --c-optional:#9097A8; --c-none:#4A5060;
  --warn:#F5C86E; --warn-bg:#2E2510; --sign:#1D2230; --sign-ink:#ECEEF3;
  --lift:0 1px 0 rgba(255,255,255,.03),0 8px 22px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
html,body{margin:0;color:var(--ink);font:15.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden;background:var(--paper);min-height:100dvh}
a{color:var(--line-c,var(--ink))}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.012em}
:focus-visible{outline:2.5px solid var(--line-c,var(--ink));outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- gate: a ticket ---------- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px 18px;position:relative;overflow:hidden}
#gate .bigkanji{position:absolute;right:-.06em;top:0;bottom:0;display:flex;align-items:center;writing-mode:vertical-rl;font:800 min(40vh,240px)/1 var(--mincho);color:var(--ink);opacity:.045;pointer-events:none;user-select:none}
.ticket{position:relative;width:100%;max-width:360px;background:var(--surface);border-radius:20px;box-shadow:var(--lift);
  -webkit-mask:radial-gradient(circle 11px at 0 64%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 64%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .route{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 0}
.ticket .tstn{display:flex;flex-direction:column}
.ticket .tstn b{font:800 34px/1 var(--mincho);letter-spacing:.02em;white-space:nowrap}
.ticket .tstn span{font-size:12.5px;color:var(--muted);margin-top:6px}
.ticket .tstn.to{text-align:right;align-items:flex-end}
.ticket .rail{flex:1;margin:0 14px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--city-0),var(--city-1),var(--city-2));position:relative;top:-10px}
.ticket .who{padding:16px 22px 18px;font-size:13.5px;color:var(--muted)}
.ticket .who b{color:var(--ink);font-weight:600}
.ticket .perf{border-top:2px dashed var(--line);margin:0 18px}
.ticket form{padding:18px 22px 14px}
.ticket label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.ticket input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);outline:none;transition:border-color .2s}
.ticket input:focus{border-color:var(--ink)}
.ticket button{margin-top:10px;width:100%;font-weight:650;font-size:15.5px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);cursor:pointer}
.ticket button:active{transform:scale(.985)}
.err{color:var(--c-essential);min-height:20px;margin-top:10px;font-size:13.5px}
.shake{animation:shake .38s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--hair)}
.bar .wrap{display:flex;align-items:center;gap:8px;height:54px}
.lines{display:flex;gap:4px;flex:1;min-width:0}
.lines button{border:0;background:transparent;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.lines button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.lb{width:24px;height:24px;border-radius:50%;border:3px solid var(--lc);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);background:var(--surface);flex:0 0 auto}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}

/* ---------- station sign hero ---------- */
.sign{position:relative;margin:14px 0 0;border-radius:22px;overflow:hidden;background:var(--sign);box-shadow:var(--lift)}
.sign .photo{position:relative;height:168px;background:color-mix(in srgb,var(--line-c) 22%,var(--surface2));overflow:hidden}
.sign .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .7s var(--ease),transform 1.4s var(--ease)}
.sign .photo img.on{opacity:1;transform:none}
.sign .photo.loaded .credit{display:block}
.sign .photo:after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,color-mix(in srgb,var(--sign) 55%,transparent))}
.sign .board{position:relative;text-align:center;padding:0 16px;margin-top:-30px;z-index:1}
.sign .kana{font-size:13px;letter-spacing:.3em;color:var(--muted);padding-left:.3em}
.sign .kanji{font:800 64px/1.02 var(--mincho);letter-spacing:.14em;padding-left:.14em;color:var(--sign-ink);text-shadow:0 2px 0 var(--sign),0 -2px 0 var(--sign),2px 0 0 var(--sign),-2px 0 0 var(--sign)}
.sign .romaji{font-size:20px;font-weight:600;letter-spacing:.02em;margin-top:2px}
.sign .band{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--line-c);color:#fff;margin-top:14px;min-height:40px}
.sign .band button{border:0;background:transparent;color:#fff;font-size:13.5px;font-weight:600;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px}
.sign .band button:disabled{opacity:0;pointer-events:none}
.sign .band .prev{justify-self:start}.sign .band .next{justify-self:end}
.sign .band .here{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--line-c);display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 0 0 3px color-mix(in srgb,#fff 35%,transparent)}
.sign .tri{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent}
.sign .prev .tri{border-right:7px solid #fff}.sign .next .tri{border-left:7px solid #fff}
.sign .foot{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:11px 16px 13px;font-size:13px;color:var(--muted)}
.sign .foot .base{min-width:0}
.sign .foot .dates{white-space:nowrap;font-weight:600;color:var(--ink)}
.credit{display:none;position:absolute;right:10px;top:8px;z-index:2;font-size:10px;color:#fff;opacity:.75;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ---------- trip progress + day strip ---------- */
.progress{display:flex;align-items:center;gap:10px;margin:18px 2px 0;font-size:13px;color:var(--muted)}
.progress .track{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.progress .track i{flex:1;background:var(--c);opacity:.25}
.progress .track i.done{opacity:1}
.days{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 16px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 12px 10px 10px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;position:relative;transition:border-color .2s,background .2s}
.dchip .sb{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--line-c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto;background:var(--surface)}
.dchip .sb small{font-size:8.5px;font-weight:700;color:var(--muted)}
.dchip .sb b{font-size:13px;font-weight:700}
.dchip .tx{display:flex;flex-direction:column;line-height:1.2}
.dchip .wd{font-size:12px;color:var(--muted);font-weight:500}
.dchip .lbl{font-size:13.5px;font-weight:600;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.dchip[aria-selected="true"]{border-color:var(--line-c);background:color-mix(in srgb,var(--line-c) 9%,var(--surface))}
.dchip[aria-selected="true"] .sb{background:var(--line-c);color:#fff}
.dchip[aria-selected="true"] .sb small{color:#fff;opacity:.85}
.dchip .today{position:absolute;top:-7px;right:10px;font-size:10px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 6px}

/* ---------- day head ---------- */
.dayhead{margin:18px 0 4px}
.dayhead .date{font-size:13.5px;color:var(--muted);font-weight:500}
.dayhead h2{font-size:28px;line-height:1.12;margin:3px 0 6px;letter-spacing:-.02em;font-stretch:92%}
.dayhead p{margin:0;color:var(--muted);max-width:60ch}
.note{margin-top:12px;font-size:13.5px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;display:flex;gap:8px}
.stats{display:flex;gap:16px;margin:14px 0 0;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px;font-weight:650;margin-right:3px}

/* ---------- filters ---------- */
.legend{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 4px;margin:0 -16px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.lg{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:550;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;min-height:36px;transition:background .15s,border-color .15s}
.lg .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.lg .ct{color:var(--muted);font-weight:500}
.lg[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.lg[aria-pressed="true"] .dot{background:#fff}.lg[aria-pressed="true"] .ct{color:#fff;opacity:.8}
.lg.tired{border-style:dashed}
.lg.tired[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);border-style:solid}
.lg.clear{color:var(--muted);border-color:transparent;background:transparent}

/* ---------- clusters + travel legs ---------- */
li.leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 0 50px;padding:6px 10px 6px 12px;font-size:12.5px;color:var(--muted);border-left:2px dashed var(--line-c,#bbb);position:relative}
li.leg .li{font-size:14px}li.leg .lh{flex:1 1 220px;color:var(--ink)}li.leg .lt{font-weight:600;white-space:nowrap}
li.clus{margin:14px 0 2px;padding:0}
li.clus span{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--paper)}
/* ---------- rail timeline ---------- */
ol.tl{list-style:none;margin:10px 0 0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:6px 0;position:relative}
.stop:before{content:"";position:absolute;left:22px;top:0;bottom:0;width:6px;background:var(--line-c);opacity:.9}
.stop:first-child:before{top:22px;border-radius:3px 3px 0 0}.stop:last-child:before{bottom:calc(100% - 26px);border-radius:0 0 3px 3px}
.rail-col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.stn{width:30px;height:30px;border-radius:50%;background:var(--surface);border:4px solid var(--line-c);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.k-none .stn{width:16px;height:16px;border-width:3px;margin-top:7px}
.k-none .stn span{display:none}
.stop.past .stn{background:var(--line-c);color:#fff}
.stop.next .stn{box-shadow:0 0 0 5px color-mix(in srgb,var(--line-c) 25%,transparent)}
.time{font-size:12px;font-weight:600;color:var(--muted);margin-top:5px;text-align:center;line-height:1.15;background:var(--paper);padding:2px 1px;white-space:nowrap;font-size:12px;letter-spacing:-.01em;border-radius:4px}
.time small{display:block;font-size:10px;font-weight:600;opacity:.8}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--lift);overflow:hidden;position:relative;cursor:pointer;transition:transform .18s var(--ease)}
.card:active{transform:scale(.985)}
.k-optional .card{box-shadow:none;outline:1.5px dashed var(--line);outline-offset:-1.5px}
.ph{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;
  --sa:color-mix(in srgb,var(--c) 14%,var(--surface2)); --sb:color-mix(in srgb,var(--c) 26%,var(--surface2));
  background-color:var(--sa);
  background-image:
   radial-gradient(circle at 100% 150%,var(--sa) 24%,var(--sb) 24%,var(--sb) 28%,var(--sa) 28%,var(--sa) 36%,var(--sb) 36%,var(--sb) 40%,transparent 40%,transparent),
   radial-gradient(circle at 0 150%,var(--sa) 24%,var(--sb) 24%,var(--sb) 28%,var(--sa) 28%,var(--sa) 36%,var(--sb) 36%,var(--sb) 40%,transparent 40%,transparent),
   radial-gradient(circle at 50% 100%,var(--sb) 10%,var(--sa) 10%,var(--sa) 23%,var(--sb) 23%,var(--sb) 30%,var(--sa) 30%,var(--sa) 43%,var(--sb) 43%,var(--sb) 50%,var(--sa) 50%,var(--sa) 63%,var(--sb) 63%,var(--sb) 71%,transparent 71%,transparent),
   radial-gradient(circle at 100% 50%,var(--sb) 5%,var(--sa) 5%,var(--sa) 15%,var(--sb) 15%,var(--sb) 20%,var(--sa) 20%,var(--sa) 29%,var(--sb) 29%,var(--sb) 34%,var(--sa) 34%,var(--sa) 44%,var(--sb) 44%,var(--sb) 49%,transparent 49%,transparent),
   radial-gradient(circle at 0 50%,var(--sb) 5%,var(--sa) 5%,var(--sa) 15%,var(--sb) 15%,var(--sb) 20%,var(--sa) 20%,var(--sa) 29%,var(--sb) 29%,var(--sb) 34%,var(--sa) 34%,var(--sa) 44%,var(--sb) 44%,var(--sb) 49%,transparent 49%,transparent);
  background-size:44px 22px}
.ph:not(.loaded):after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--surface) 45%,transparent) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.ph.done:after{display:none}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s var(--ease)}
.ph img.on{opacity:1}
.ph .src{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;opacity:.8;text-shadow:0 1px 2px rgba(0,0,0,.6);display:none}
.ph.loaded .src{display:block}
.ph .badge{position:absolute;left:10px;top:10px;z-index:1;font-size:11.5px;font-weight:650;color:#fff;background:var(--c);border-radius:8px;padding:3px 8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ph .now{position:absolute;right:10px;top:10px;z-index:1;font-size:11.5px;font-weight:650;color:var(--line-c);background:var(--surface);border-radius:8px;padding:3px 8px}
.body{padding:12px 14px 14px}
.card h3{font-size:17.5px;line-height:1.25;letter-spacing:-.01em}
.card h3 .g{display:inline-block;width:15px;height:15px;vertical-align:-1px;margin-left:6px;opacity:.45}
.desc{margin:6px 0 0;font-size:14.5px;color:var(--ink);opacity:.86;max-width:62ch}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;padding:6px 0 0;color:var(--line-c);font-size:13px;font-weight:650;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.tag{font-size:11.5px;font-weight:600;border-radius:7px;padding:3px 8px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.tag.optional{outline:1px dashed var(--c);background:transparent}
.cost{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:auto}
.acts{display:flex;gap:6px;margin-top:12px}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;border-radius:11px;padding:9px 10px;color:var(--ink);background:var(--surface2);min-height:40px}
.act svg{width:16px;height:16px;flex:0 0 auto}
.alert{margin-top:10px;font-size:13.5px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px}
.stop.k-none .card{background:transparent;box-shadow:none;cursor:default}
.stop.k-none .card:active{transform:none}
.stop.k-none .body{padding:9px 4px 10px}
.stop.k-none h3{font-size:14.5px;font-weight:600}
.stop.k-none .desc{font-size:13.5px;color:var(--muted);opacity:1}
.empty{color:var(--muted);text-align:center;padding:32px 0;font-size:14.5px}

/* ---------- food panels ---------- */
.panel{margin:28px 0 0;background:var(--surface);border-radius:22px;padding:18px 16px 8px;box-shadow:var(--lift)}
.panel h3{font-size:20px;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.panel h3 .ji{font:800 15px/1 var(--mincho);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:0 0 auto}
.panel .sub{font-size:13px;color:var(--muted);margin:4px 0 12px}
.prayer{font-size:13.5px;margin:0 0 12px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.fitem{border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.fitem:first-of-type{border-top:0}
.ftop{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ftop b{font-size:15.5px;font-weight:650}
.fwhere{font-size:13px;color:var(--muted);margin-top:1px}
.fwhere a{font-weight:600;text-decoration:none}
.fwhat{font-size:14px;margin:4px 0 0}
.pill{font-size:11px;font-weight:650;border-radius:6px;padding:2px 7px}
.pill.cert{color:var(--c-booked);background:color-mix(in srgb,var(--c-booked) 14%,transparent)}
.pill.friendly{color:var(--c-gem);background:color-mix(in srgb,var(--c-gem) 14%,transparent)}
.pill.check{color:var(--c-optional);background:color-mix(in srgb,var(--c-optional) 16%,transparent)}
.fprice{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:600}
.jtag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;margin:7px 4px 0 0;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.jorder{font-size:13.5px;margin:5px 0 0}.jnote{font-size:13px;color:var(--muted);margin:3px 0 0}

/* ---------- food + bookings views ---------- */
.vhead{margin:22px 0 4px}
.vhead h2{font-size:34px;letter-spacing:-.025em;line-height:1.05;display:flex;align-items:baseline;gap:12px}
.vhead h2 .jp{font:800 22px/1 var(--mincho);color:var(--muted);letter-spacing:.1em}
.vhead p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.fsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 0}
.fsel select{font:inherit;font-size:14px;font-weight:550;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;width:100%}
.fsel select:last-child{grid-column:1/-1}
.group{margin:26px 0 0}
.group>h3{font-size:14px;font-weight:650;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.group>h3 .lb{width:20px;height:20px;border-width:2.5px;font-size:9.5px}
.group>h3 .go{margin-left:auto;border:0;background:none;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;padding:6px 0}
.fcard{background:var(--surface);border-radius:16px;padding:12px 14px 13px;margin-bottom:8px;box-shadow:var(--lift);position:relative;overflow:hidden;cursor:pointer}
.fcard:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.fcard .srcl{font-size:12px;font-weight:600;color:var(--c);margin-bottom:3px}
.fskip{font-size:13.5px;color:var(--muted);margin:5px 0}
.bk{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--lift);width:100%;border:0;text-align:left}
.bk .bt{font-size:13px;font-weight:700;line-height:1.2}
.bk b{display:block;font-size:15px;font-weight:620;line-height:1.3}
.bk span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.bk .chev{width:16px;height:16px;color:var(--muted)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);padding:5px;border-radius:22px;box-shadow:0 12px 32px -8px rgba(10,14,25,.35),0 0 0 1px var(--line)}
.nav button{border:0;background:transparent;color:var(--muted);padding:7px 16px 6px;border-radius:17px;font-size:11.5px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px}
.nav button svg{width:22px;height:22px}
.nav button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.spacer{height:calc(110px + env(safe-area-inset-bottom))}
footer{margin-top:30px;font-size:12.5px;color:var(--muted);text-align:center}
.enter{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:560px){
  .sign .photo{height:220px}
  .sign .kanji{font-size:80px}
}
@media (max-width:380px){
  .lines button{padding:6px 8px 6px 5px;font-size:13px}
  .sign .kanji{font-size:54px}
  .nav button{min-width:70px;padding:7px 12px 6px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(BLOB.s), iterations:BLOB.n, hash:"SHA-256"},
              base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.i)}, key, b64(BLOB.c));
  return JSON.parse(new TextDecoder().decode(plain));
}
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
document.getElementById("gateform").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, btn = document.getElementById("gobtn");
  btn.textContent = "Opening…";
  try{ const data = await unlock(pw); store.set("jp_pw", pw); start(data); }
  catch(err){
    btn.textContent = "Open the trip";
    document.getElementById("err").textContent = "That password didn't work. Check it and try again.";
    const t = document.getElementById("ticket"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
  }
});
(async () => { const saved = store.get("jp_pw"); if(saved){ try{ start(await unlock(saved)); }catch(e){} } })();

/* ---------- cities as rail lines ---------- */
const JP = {osaka:["大阪","おおさか","Ōsaka"], kyoto:["京都","きょうと","Kyōto"], tokyo:["東京","とうきょう","Tōkyō"]};
function jp(c){ return JP[strip(c.name).trim().toLowerCase()] || [null, null, c.name]; }
function code(c){ return strip(c.name).trim().charAt(0).toUpperCase(); }
function lineVar(i){ return `--line-c:var(--city-${Math.min(i,3)});--lc:var(--city-${Math.min(i,3)})`; }

/* ---------- categories ---------- */
const CATS = [
  ["booked",   "Booked"],
  ["essential","Must-do"],
  ["musttry",  "Must-try food"],
  ["gem",      "Hidden gem"],
  ["popular",  "Popular"],
  ["local",    "Local favourite"],
  ["optional", "Skip if tired"],

const CAT = Object.fromEntries(CATS.map(([k,l]) => [k,{label:l}]));
const ORDER = CATS.map(c => c[0]);
const STATUS = {cert:"Halal certified", friendly:"Halal menu", check:"Check at door"};
const JT = {seafood:["Seafood","popular"], veggie:["Veggie options","local"], sweets:["Sweets","gem"], beef:["Beef","essential"],
  drink:["Drink","local"], porkmenu:["Pork on menu, order around it","essential"], zuha:["Zuha-friendly","booked"], line:["Expect a line","optional"],
  reserve:["Book ahead","optional"], splurge:["Splurge","musttry"], verify:["Check hours","optional"], halal:["Halal","booked"]};
function jtags(t){ return (t||[]).map(x => JT[x] ? `<span class="jtag" style="--c:var(--c-${JT[x][1]})">${JT[x][0]}</span>` : "").join(""); }
function kind(r){ for(const k of ORDER){ if(r.tags.includes(k)) return k; } return "none"; }
function cvar(k){ return `--c:var(--c-${k})`; }

/* ---------- helpers ---------- */
function dayToDate(s){ const m = s.match(/(\d+) (\w+)/); return m ? Date.UTC(2026, 9, +m[1]) : null; }
function jstNow(){ return new Date(Date.now() + 9*3600e3); }
function jstToday(){ const n = jstNow(); return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()); }
function strip(h){ const d = document.createElement("div"); d.innerHTML = h ?? ""; return d.textContent; }
function short(t){ return strip(t).split(/\s[&—–]\s|&|—/)[0].trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function gSearch(q){ return "https://www.google.com/search?q=" + encodeURIComponent(q); }
function gMap(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
/* minutes since midnight from strings like "9:30", "9:30am", "14:00", "~10", "2pm" */
function fmtT(t){ return String(t).replace(/\s*([AaPp]\.?[Mm]\.?)\s*$/, "<small>$1</small>"); }
function mins(t){
  const m = strip(t||"").match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/i); if(!m) return null;
  let h = +m[1]; const mm = +(m[2]||0), ap = (m[3]||"").toLowerCase();
  if(!m[2] && !ap) return null;
  if(ap === "pm" && h < 12) h += 12; if(ap === "am" && h === 12) h = 0;
  return h*60 + mm;
}

/* ---------- photos: Wikipedia, then Wikimedia Commons (in-browser, cached) ---------- */
let PHOTO = {}; try{ PHOTO = JSON.parse(store.get("jp_photos_v3") || "{}"); }catch(e){}
const inflight = {};
const WP = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*";
const big = u => u ? u.replace(/\/(\d+)px-/, "/960px-") : null;
const getJ = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
function wikiSummary(title){
  return getJ("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title.replace(/ /g,"_")))
    .then(j => j && j.type !== "disambiguation" ? big(j.thumbnail?.source || j.originalimage?.source) : null);
}
function wikiSearch(q){
  return getJ(WP + "&generator=search&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=960&gsrsearch=" + encodeURIComponent(q))
    .then(j => { const ps = j && j.query ? Object.values(j.query.pages) : []; ps.sort((a,b) => a.index - b.index);
      const p = ps.find(p => p.thumbnail && !/\.svg/i.test(p.thumbnail.source)); return p ? p.thumbnail.source : null; });
}
function commonsSearch(q){
  return getJ("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url|mime&iiurlwidth=960&gsrsearch=" + encodeURIComponent(q + " filetype:bitmap"))
    .then(j => { const ps = j && j.query ? Object.values(j.query.pages) : []; ps.sort((a,b) => a.index - b.index);
      const p = ps.find(p => p.imageinfo && /jpe?g|png|webp/i.test(p.imageinfo[0].mime||"")); return p ? (p.imageinfo[0].thumburl || p.imageinfo[0].url) : null; });
}
function photoFor(spec){
  if(!spec) return Promise.resolve(null);
  if(spec in PHOTO) return Promise.resolve(PHOTO[spec]);
  if(inflight[spec]) return inflight[spec];
  const [wiki, query] = spec.split("|");
  let p = wiki ? wikiSummary(wiki) : Promise.resolve(null);
  p = p.then(u => u || (query ? wikiSearch(query) : wiki ? wikiSearch(wiki) : null))
       .then(u => u || (query ? commonsSearch(query) : null));
  inflight[spec] = p.then(u => { if(u || navigator.onLine){ PHOTO[spec] = u || null; store.set("jp_photos_v3", JSON.stringify(PHOTO)); } return u; });
  return inflight[spec];
}
function loadImg(holder){
  const spec = holder.dataset.photo; if(!spec) return;
  photoFor(spec).then(u => {
    if(!u){ holder.classList.add("done"); return; }
    const img = new Image(); img.alt = ""; img.decoding = "async";
    img.onload = () => { holder.prepend(img); requestAnimationFrame(() => img.classList.add("on")); holder.classList.add("loaded"); };
    img.onerror = () => { holder.classList.add("done"); PHOTO[spec] = null; };
    img.src = u;
  });
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ io.unobserve(e.target); loadImg(e.target); } }), {rootMargin:"600px 0px"}) : null;
function watchImgs(root){ root.querySelectorAll("[data-photo]").forEach(h => io ? io.observe(h) : loadImg(h)); }

/* ---------- state ---------- */
let DATA, state = {food:{city:"all", day:"all", src:"all", tags:new Set()}, city:0, day:0, view:"plan", filter:new Set(), tired:false, open:new Set(), anim:true};
function start(data){
  DATA = data;
  document.getElementById("gate")?.remove();
  document.getElementById("app").hidden = false;
  const t = jstToday(); let found = false;
  DATA.cities.forEach((c, ci) => c.days.forEach((d, di) => { if(!found && dayToDate(d.date) === t){ state.city = ci; state.day = di; found = true; } }));
  if(!found){ const sc = store.get("jp_city"), sd = store.get("jp_day");
    if(sc !== null){ state.city = Math.min(+sc, DATA.cities.length-1); state.day = Math.min(+(sd||0), DATA.cities[state.city].days.length-1); } }
  state.tired = store.get("jp_tired") === "1";
  render();
}
function save(){ store.set("jp_city", state.city); store.set("jp_day", state.day); }
function flatIndex(ci, di){ let n = 0; for(let i = 0; i < ci; i++) n += DATA.cities[i].days.length; return n + di; }
function totalDays(){ return DATA.cities.reduce((n,c) => n + c.days.length, 0); }

/* ---------- render ---------- */

function planView(){
  const ci = state.city, city = DATA.cities[ci], day = city.days[state.day], t = jstToday();
  const [kanji, kana, romaji] = jp(city);
  const prev = DATA.cities[ci-1], next = DATA.cities[ci+1];
  const isToday = dayToDate(day.date) === t;

  const flat = flatIndex(ci, state.day), total = totalDays();
  const firstD = dayToDate(DATA.cities[0].days[0].date), lead = firstD ? Math.round((firstD - t)/864e5) : 0;

      `<button class="lg" style="${cvar(k)}" data-f="${k}" aria-pressed="${state.filter.has(k)}"><span class="dot"></span>${l}<span class="ct">${counts[k]}</span></button>`).join("")
    + (counts.optional ? `<button class="lg tired" style="${cvar('optional')}" id="tiredbtn" aria-pressed="${state.tired}"><span class="dot"></span>${state.tired?"Showing essentials only":"Tired? Hide skippable"}</button>` : "")

  // past / next markers on today

  let nextIdx = -1;
  if(isToday){ nextIdx = day.rows.findIndex(r => { const m = mins(r.t); return m !== null && m >= nowM - 20; }); }
  const timingOf = i => { if(!isToday) return ""; if(nextIdx === -1) return mins(day.rows[i].t) !== null ? "past" : ""; return i < nextIdx ? "past" : i === nextIdx ? "next" : ""; };

      <div class="board">
        ${kana?`<div class="kana">${kana}</div>`:""}

    <div class="fsel">
      <select id="fcity" aria-label="City"><option value="all">All cities</option>${DATA.cities.map((c,i)=>`<option value="${i}" ${F.city==String(i)?"selected":""}>${c.name}</option>`).join("")}</select>
      <select id="fday" aria-label="Day"><option value="all">All days</option>${dayOpts.map(([k,l])=>`<option value="${k}" ${F.day===k?"selected":""}>${l}</option>`).join("")}</select>
      <select id="fsrc" aria-label="Source"><option value="all">Halal picks and Jack's picks</option><option value="jack" ${F.src==="jack"?"selected":""}>Jack's picks only</option><option value="halal" ${F.src==="halal"?"selected":""}>Halal picks only</option></select>
    </div>
    <div class="legend">${tagChips}${F.tags.size?`<button class="lg clear" id="clearft">Clear filters</button>`:""}</div>
    ${body}${extra}<div class="spacer"></div></div>`;
}
function bookingsView(){
  const out = [];
  DATA.cities.forEach((c, ci) => c.days.forEach((d, di) => {
    const b = d.rows.filter(r => r.tags.includes("booked") && !/^(Check out|Leave|Arrive Tokyo|Walk to)/.test(strip(r.title)));
    if(b.length) out.push(`<div class="group" style="${lineVar(ci)}"><h3><span class="lb">${code(c)}</span>${d.date}, ${c.name}</h3>${b.map(r => {
      const al = r.alert ? strip(r.alert) : "";
      return `<button class="bk" data-go="${ci}:${di}"><span class="bt tnum">${r.t||""}</span><span><b>${r.title}</b><span>${r.cost||""}${al?(r.cost?" · ":"")+esc(al.slice(0,90))+(al.length>90?"…":""):""}</span></span><span class="chev">${I.chev}</span></button>`; }).join("")}</div>`);
  }));
  return `<div class="wrap ${state.anim?"enter":""}"><section class="vhead"><h2>Bookings <span class="jp">予約</span></h2>
    <p>Everything with a fixed time or a ticket. Tap one to open that day.</p></section>${out.join("") || `<div class="empty">No bookings yet. Tag a stop as booked and it shows up here.</div>`}<div class="spacer"></div></div>`;
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = topbar() + (state.view === "plan" ? planView() : state.view === "food" ? foodView() : bookingsView()) +
    `<nav class="nav" role="tablist"><button data-view="plan" aria-selected="${state.view==='plan'}">${I.rail}Itinerary</button><button data-view="food" aria-selected="${state.view==='food'}">${I.food}Food</button><button data-view="bookings" aria-selected="${state.view==='bookings'}">${I.ticket}Bookings</button></nav>`;
  state.anim = false;
  bind(app);
  watchImgs(app);
  const hero = app.querySelector("[data-hero]");
  if(hero && hero.dataset.hero){ photoFor(hero.dataset.hero + "|" + hero.dataset.hero).then(u => { if(!u) return; const img = new Image(); img.alt=""; img.onload=()=>{ hero.prepend(img); hero.classList.add("loaded"); requestAnimationFrame(() => img.classList.add("on")); }; img.src=u; }); }
  const sel = app.querySelector('.dchip[aria-selected="true"]'); if(sel) sel.scrollIntoView({inline:"center", block:"nearest"});
}
function go(fn, top){ state.anim = true; fn(); save(); render(); if(top) window.scrollTo({top:0, behavior: top === "smooth" ? "smooth" : "auto"}); }
function goDay(delta){
  const c = DATA.cities[state.city]; let d = state.day + delta, ci = state.city;
  if(d < 0){ if(ci === 0) return; ci--; d = DATA.cities[ci].days.length-1; }
  else if(d >= c.days.length){ if(ci === DATA.cities.length-1) return; ci++; d = 0; }
  go(() => { state.city = ci; state.day = d; state.open.clear(); }, "smooth");
}
function openG(q){ window.open(gSearch(q), "_blank", "noopener"); }
function bind(app){
  app.querySelectorAll("[data-city]").forEach(b => b.onclick = () => { const i = +b.dataset.city; if(!DATA.cities[i]) return; go(() => { state.view="plan"; state.city = i; state.day = 0; state.open.clear(); }, true); });
  app.querySelectorAll("[data-day]").forEach(b => b.onclick = () => go(() => { state.day = +b.dataset.day; state.open.clear(); }));
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { const f = b.dataset.f; state.filter.has(f) ? state.filter.delete(f) : state.filter.add(f); render(); });
  app.querySelectorAll("[data-more]").forEach(b => b.onclick = e => { e.stopPropagation(); const i = +b.dataset.more; state.open.has(i) ? state.open.delete(i) : state.open.add(i); render(); });
  app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(() => { state.view = b.dataset.view; }, true));
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = e => { e.stopPropagation(); const [ci,di] = b.dataset.go.split(":").map(Number); go(() => { state.view="plan"; state.city=ci; state.day=di; }, true); });
  // tap a stop or a place anywhere except its own links/buttons → Google search
  app.querySelectorAll("[data-g]").forEach(el => {
    el.onclick = e => { if(e.target.closest("a,button,select")) return; if(getSelection && String(getSelection()).length) return; openG(el.dataset.g); };
    el.onkeydown = e => { if((e.key === "Enter" || e.key === " ") && e.target === el){ e.preventDefault(); openG(el.dataset.g); } };
  });
  const fc = document.getElementById("fcity"); if(fc){ fc.onchange = () => { state.food.city = fc.value; state.food.day = "all"; render(); };
    document.getElementById("fday").onchange = e => { state.food.day = e.target.value; render(); };
    document.getElementById("fsrc").onchange = e => { state.food.src = e.target.value; render(); }; }
  app.querySelectorAll("[data-ft]").forEach(b => b.onclick = () => { const t = b.dataset.ft; state.food.tags.has(t) ? state.food.tags.delete(t) : state.food.tags.add(t); render(); });
  const cft = document.getElementById("clearft"); if(cft) cft.onclick = () => { state.food.tags.clear(); render(); };
  const tb = document.getElementById("tiredbtn"); if(tb) tb.onclick = () => { state.tired = !state.tired; store.set("jp_tired", state.tired?"1":"0"); render(); };
  const cf = document.getElementById("clearf"); if(cf) cf.onclick = () => { state.filter.clear(); render(); };
  document.getElementById("themebtn").onclick = () => {
    const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    r.dataset.theme = cur === "dark" ? "light" : "dark"; store.set("jp_theme", r.dataset.theme); };
}
/* swipe between days */
let sx = null, sy = null;
document.addEventListener("touchstart", e => { if(!DATA || state.view!=="plan" || e.target.closest(".days,.legend")) { sx=null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e => { if(sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6) goDay(dx < 0 ? 1 : -1); sx = null; }, {passive:true});
document.addEventListener("keydown", e => { if(!DATA || state.view!=="plan" || e.target.closest("input,select")) return; if(e.key==="ArrowRight") goDay(1); if(e.key==="ArrowLeft") goDay(-1); });
</script>
</body>
</html>
